# The container images for a release: ghcr.io/ohartwig/pinup and
# ghcr.io/ohartwig/pinup-toolchain, linux/amd64 and linux/arm64.
#
# THIS WORKFLOW DOES NOT BUILD PINUP. It downloads the binaries of the
# release, checks them against SHA256SUMS, and copies one into an image.
# The distinction is the reason an earlier workflow here was deleted: it
# rebuilt the binaries when the tag arrived, which put a second artefact
# under the release's name with nobody's signature on it. The release is
# cut, built and signed upstream; this packages what it published.
#
# Signing is keyless: the image signature is made against this workflow's
# OIDC identity, so anyone can verify it without a key from us --
#
#   cosign verify ghcr.io/ohartwig/pinup:0.34.0 \
#     --certificate-identity-regexp '^https://github.com/ohartwig/pinup/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Actions are pinned to commit SHAs, with the version behind each SHA
# written beside it. pinup's github-actions manager reads that comment and
# moves the SHA and the version together (.pinup.jsonc enables it here);
# keep the `@<sha>  # vX.Y.Z` form, since a SHA without its version is
# reported as not updatable.
name: images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, e.g. v0.34.0"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/pinup
  TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/pinup-toolchain
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing
    steps:
      - name: The tag being packaged
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH tag"; exit 1 ;;
          esac
          version="${tag#v}"
          # Rolling tags, the way the estate's images carry them: the exact
          # version, the minor line, the major line. `latest` last, so a
          # pull without a tag gets the newest release and nothing else.
          major="${version%%.*}"
          minor="${version%.*}"
          # A rolling tag moves only to the newest release it names: latest
          # and the major line to the newest release overall, the minor line
          # to the newest of that minor. Until 2026-09-23 all three moved on
          # every run - which is right for the release that just happened
          # and wrong for anything packaged later: a dispatch for a release
          # whose run had failed would have turned latest back a version.
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 500 \
            --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V)"
          newest_in() { printf '%s\n' "$releases" | grep -E "^${1//./\\.}\." | tail -1; }
          rolling=""
          if [ "$version" = "$(newest_in "$minor")" ]; then rolling="$rolling $minor"; fi
          if [ "$version" = "$(newest_in "$major")" ]; then rolling="$rolling $major"; fi
          if [ "$version" = "$(printf '%s\n' "$releases" | tail -1)" ]; then rolling="$rolling latest"; fi
          echo "rolling tags for $version:${rolling:- none, a newer release carries them}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "core_tags<<TAGS_EOF"
            echo "$CORE_IMAGE:$version"
            for r in $rolling; do echo "$CORE_IMAGE:$r"; done
            echo "TAGS_EOF"
            echo "toolchain_tags<<TAGS_EOF"
            echo "$TOOLCHAIN_IMAGE:$version"
            for r in $rolling; do echo "$TOOLCHAIN_IMAGE:$r"; done
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # The release's own binaries, and the manifest they were signed under.
      # `sha256sum -c` is the gate: a download that does not match what the
      # release published stops the build here, before anything is pushed.
      #
      # The release is published before its files are: the upstream job
      # creates it, then uploads fourteen assets over the next 10-20
      # seconds, and `published` starts this run within one. Whether the
      # download found the binaries was a race - v0.36.0, v0.36.2 and
      # v0.37.0 lost it ("no assets to download"), v0.36.1 and v0.38.0 won.
      # So the files are waited for, each until GitHub reports it uploaded.
      - name: Fetch and verify the released binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          missing=""
          for _ in $(seq 60); do
            have=" $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '[.assets[] | select(.state == "uploaded") | .name] | join(" ")') "
            missing=""
            for f in SHA256SUMS pinup-linux-amd64 pinup-linux-arm64; do
              case "$have" in *" $f "*) ;; *) missing="$missing $f" ;; esac
            done
            [ -z "$missing" ] && break
            echo "waiting for the release's assets:$missing"
            sleep 10
          done
          [ -z "$missing" ] || { echo "::error::after ten minutes the release still lacks:$missing"; exit 1; }
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'pinup-linux-*' --pattern 'SHA256SUMS'
          test -s dist/SHA256SUMS || { echo "::error::the release carries no SHA256SUMS"; exit 1; }
          for f in pinup-linux-amd64 pinup-linux-arm64; do
            test -s "dist/$f" || { echo "::error::the release carries no $f"; exit 1; }
          done
          ( cd dist && sha256sum -c --ignore-missing SHA256SUMS )
          chmod 0755 dist/pinup-linux-amd64 dist/pinup-linux-arm64

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push pinup
        id: core
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: packaging/Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tag.outputs.core_tags }}
          labels: |
            org.opencontainers.image.title=pinup
            org.opencontainers.image.description=Dependency updates across a fleet of repositories, as a single static binary
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}

      # FROM the image just pushed, by digest rather than by tag: the two
      # images of one release describe the same pinup, and a tag could be
      # overwritten between these two steps.
      - name: Build and push pinup-toolchain
        id: toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: packaging/Containerfile.toolchain
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            BASE=${{ env.CORE_IMAGE }}@${{ steps.core.outputs.digest }}
          tags: ${{ steps.tag.outputs.toolchain_tags }}
          labels: |
            org.opencontainers.image.title=pinup-toolchain
            org.opencontainers.image.description=pinup with composer, npm, go and yarn for lock-file refreshes
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ env.CORE_IMAGE }}@${{ steps.core.outputs.digest }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Scan BEFORE signing, and fail on what can be fixed. A finding with no
      # fix available holds nothing up -- it is the fixable count the gate is
      # about; unfixable ones are read from the SBOM the build attached.
      - name: Scan pinup
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.CORE_IMAGE }}@${{ steps.core.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan pinup-toolchain
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.TOOLCHAIN_IMAGE }}@${{ steps.toolchain.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # By digest, not by tag: a signature over a tag says nothing about the
      # bytes anyone pulls tomorrow.
      - name: Sign both images
        env:
          CORE: ${{ env.CORE_IMAGE }}@${{ steps.core.outputs.digest }}
          TOOLCHAIN: ${{ env.TOOLCHAIN_IMAGE }}@${{ steps.toolchain.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$CORE"
          cosign sign --yes "$TOOLCHAIN"

      - name: What was published
        env:
          CORE: ${{ env.CORE_IMAGE }}@${{ steps.core.outputs.digest }}
          TOOLCHAIN: ${{ env.TOOLCHAIN_IMAGE }}@${{ steps.toolchain.outputs.digest }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          {
            echo "### Images for ${VERSION}"
            echo
            echo '```'
            echo "$CORE"
            echo "$TOOLCHAIN"
            echo '```'
            echo
            echo "Signed keyless; verify with"
            echo
            echo '```'
            echo "cosign verify $CORE \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
