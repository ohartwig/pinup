# SPDX-License-Identifier: Apache-2.0
#
# pinup's own pipeline. Two traps govern the shape of this file, both recorded
# in docs/plan.md section 6.2:
#
#   1. Declaring `stages:` REPLACES the list the composed template supplies.
#      A job in a stage that is not declared here does not produce a YAML
#      error - it produces a pipeline with zero jobs, which reads as broken
#      infrastructure. The same is true of `workflow:`.
#   2. This file therefore declares both, as supersets, and `lint:ci-resolved`
#      asserts the resolved job list against .gitlab/expected-jobs.txt so the
#      mismatch is caught at merge time rather than at the next upstream bump.

include:
  # Components by rolling major, as the handbook decides for every consumer
  # (engineering/decisions/rolling-major-tag-for-pipelines.md): the catalogue
  # resolves `@1` to the newest 1.x, the exact pins live inside the composed
  # template where they are reviewed once. No `# renovate:` line above them -
  # there is no patch version here for pinup to raise.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/composed-default-pipelines/go@2
    inputs:
      working-directory: '.'

  # These three are NOT part of the go composed pipeline. Shipping .gitsigners
  # and an SPDX header without the job that reads them is decoration, not a
  # gate - so they are included by name.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/commit-signing-verify@1
    inputs:
      stage: quick
  # The licence gate, live since lint-tools 1.36.45 (2026-09-26). Until then
  # the include produced no job (its rule required **/*.php) and, forced to
  # run, died on an amd64-only image (GDG-50). Every pipeline, because
  # expected-jobs.txt lists it unqualified; allow_failure is taken back below.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/lint-reuse@1
    inputs:
      stage: quick
      rules-config:
        - when: on_success
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/lint-renovate-annotations@1
    inputs:
      stage: quick

  # release-tools/yasrt cuts the release: `version` decides in .pre, `release`
  # tags in the release stage with the job token -- which starts no pipeline.
  # Build, scan and signing stay on the TAG pipeline: tag-pipeline has the
  # release trigger this project on the tag it just cut, so those jobs run
  # exactly as they did when the tag came from semantic-release's push.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@2
    inputs:
      stage-version: .pre
      stage-release: release
      product: custom
      tag-format: 'v${version}'
      non-release-paths: ['.pre-commit-config.yaml']
      tag-pipeline: 'true'
      # The bot's own token starts the tag pipeline and, when that pipeline
      # fails, takes the tag and the release back (GDG-44's net). The
      # component's caveat - a pipeline started as an external user gets
      # zero jobs - does not apply: pinup-bot (322, renovate-bot until 2026-09-16) is a bot user, not
      # external, and the bot is a Maintainer of this group.
      tag-pipeline-token-var: PINUP_GITLAB_TOKEN
      # The note on every merge request and closed issue of a release, with
      # this project's own copy of the bot token (the group's copy is gone).
      mr-comments: 'true'
      comment-token-var: PINUP_GITLAB_TOKEN
      # The runner's fast lane is not started from here: the component
      # fires it when the tag is cut, which is before this tag pipeline has
      # built and uploaded the binaries the golden image fetches (v0.24.0:
      # the image's bump 404ed on fetch:binary eight minutes before upload
      # ran). trigger:pinup below fires after upload instead.
      trigger-pinup: 'false'
      rules-config:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "push"
        - when: never

  # The public mirror, from the component rather than a copy of the job:
  # yasrt, s3mail and this repository each carried one, and the copies
  # drifted. The history goes to GitHub without what is working material of
  # this instance rather than part of the project - the agent guidance, the
  # allowed-signers list, the pipeline's own bookkeeping, the task log and
  # the reviews with the estate's incident history, and the estate's fixture
  # root (testdata/estate: the runner configuration with its customers'
  # names; testdata/public is the same shape for everyone). Two paths are
  # filtered for their history: until 0.16.0 config/preset/library.json was
  # Renovate's preset data, generated by tools/presetgen (NOTICE); the
  # authored library is config/preset/presets.json, whose history starts
  # clean. The component checks after the rewrite that none of it is still
  # reachable and refuses to push otherwise. main and the v-tags, with
  # --prune; after every stage, so a tag made in this pipeline is mirrored
  # in the same one.
  #
  # GITHUB_MIRROR_TOKEN is a fine-grained token with contents:write on the
  # mirror repository - about publishing the project, not about releasing it.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-mirror@1
    inputs:
      stage: .post
      mirror-target: 'ohartwig/pinup'
      mirror-token-var: 'GITHUB_MIRROR_TOKEN'
      # Names that must not leave the instance and sit in old revisions of
      # files that otherwise belong to the project (a test table, a comment,
      # a fixture since stripped): rewritten in every blob of the history,
      # and the job refuses to push while one is still reachable. The
      # package name is replaced whole - its two-letter vendor alone would
      # match inside other words.
      replace-text:
        - 'acme==>acme'
        - 'tenant-b==>tenant-b'
        - 'tenant-c==>tenant-c'
        - 'tenant-d==>tenant-d'
        - 'tenant-e==>tenant-e'
        - 'tenant-f==>tenant-f'
        - 'vendor-x/typo3-mcp-server==>vendor-x/typo3-mcp-server'
        - 'partner-a==>partner-a'
        - 'partner-a-jobs==>partner-a-jobs'
      strip-paths: ['CLAUDE.md', '.gitsigners', '.gitsigners.d', '.gitlab', '.mise.toml', 'lefthook.yml', 'docs/tasks.md', 'docs/plan.md', 'docs/tech-spec.md', 'docs/reviews', 'testdata/estate', 'testdata/parity', 'testdata/golden', 'testdata/upstream', 'testdata/renovate/renovate-43.288.0/presets/closure.json', 'config/preset/library.json', 'tools/presetgen']
      keep-tags: 'v*'
      prune: 'true'
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        # push, web and api: a run started by hand on main mirrors too.
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")
        # And the tag pipeline, before release:github: a release needs its
        # tag on GitHub first.
        - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

  # The GitHub release, with the files this pipeline built and signed - the
  # same files release:links links here. The workflow that rebuilt the
  # binaries on GitHub is gone: a binary built a second time elsewhere is a
  # second artefact under the same name, and the signature over SHA256SUMS
  # cannot be rebuilt at all. Same component as yasrt and s3mail.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-release@1
    inputs:
      stage: .post
      release-target: 'ohartwig/pinup'
      release-token-var: 'GITHUB_MIRROR_TOKEN'
      assets: ['dist/*.zip', 'dist/*.sha256', 'dist/pinup-*64', 'SHA256SUMS', 'SHA256SUMS.sig']
      needs-config:
        - mirror:github
        - build:linux-arm64
        - build:linux-amd64
        - build:darwin-arm64
        - build:darwin-amd64
        - manifest
        - job: sign:artifact:SHA256SUMS
          optional: true
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

  # Signing the manifest comes from the estate: a detached cosign signature
  # over SHA256SUMS, key in KMS, role over OIDC, verified before the job
  # ends. Same component and same reasoning as S3mail.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/build-provenance/sign-artifact@2
    inputs:
      stage: release
      artifact-file: SHA256SUMS
      needs-config:
        - job: manifest
      # Must match manifest's own rule: the job must not exist where the
      # manifest does not, or the pipeline is refused for a missing need.
      rules-config:
        - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

# A superset of the composed list. `build`, `release` and `update` are ours.
stages:
  - quick
  - test
  - build
  - release
  - update

# A superset of the composed workflow. Only the `schedule` line is ours: the
# self-update job (docs/tasks.md D.4) runs on a schedule, and the composed
# workflow does not admit that source - without this line that pipeline would
# silently not be created.
workflow:
  auto_cancel:
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

variables:
  # The tag on a variable of its own: the annotation manager reads a
  # quoted version, not an image reference. Until 2026-09-18 the line
  # annotated GO_IMAGE itself and named no dependency at all - pinup's
  # own orphan-annotation warning found it, in pinup's own pipeline.
  # pinup: datasource=docker depName=registry.ole-hartwig.eu/devops/images/golang
  GOLANG_IMAGE_TAG: "1.27"
  GO_IMAGE: "registry.ole-hartwig.eu/devops/images/golang:$GOLANG_IMAGE_TAG"
  # update:pinup runs on the toolchain image: gpg for the signature, git,
  # go for the go.sum refresh. The binary it runs is this tree's own, built
  # by build:linux-arm64 - the image's pinup is only a bystander.
  # pinup: datasource=docker depName=registry.ole-hartwig.eu/devops/images/pinup-toolchain
  PINUP_TOOLCHAIN_TAG: "0"
  PINUP_TOOLCHAIN_IMAGE: "registry.ole-hartwig.eu/devops/images/pinup-toolchain:$PINUP_TOOLCHAIN_TAG"
  # Do not quietly pull a different Go version: what is in the image is what
  # counts. go.mod says 1.27 and the image is 1.27; with `auto` a future bump
  # to the directive would silently download a toolchain the image does not
  # have, and the pin would be documenting a fiction.
  GOTOOLCHAIN: "local"
  # -mod=mod lets CI repair go.sum instead of reporting that it is wrong.
  GOFLAGS: "-mod=readonly"
  GOPATH: "${CI_PROJECT_DIR}/.go"
  # The task sandbox's tests skip where the kernel refuses a user namespace.
  # Here that would be a gate that does not gate, so every job that runs
  # them - test:go, test:mutation, test:sandbox:* - turns the skip into a
  # failure.
  PINUP_SANDBOX_REQUIRED: "1"
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pinup"

default:
  image: ${GO_IMAGE}
  # The fleet is spot instances: an instance can be reclaimed mid-job. That is
  # not a fault in what was built. `runner_configuration_error` covers failed
  # image pulls. Deliberately not stuck_or_timeout_failure - deprecated, and
  # /ci/lint warns about it.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - runner_external_dependency_failure
      - runner_configuration_error

# --------------------------------------------------------------------------- #
# Quick
# --------------------------------------------------------------------------- #
# Asks the running pipeline which jobs it created, rather than asking the
# file what it says. Fails when that list loses a name that
# .gitlab/expected-jobs.txt still claims - which is what an upstream
# stage-list change looks like from inside this repository.
lint:ci-resolved:
  stage: quick
  image: ${GO_IMAGE}
  cache: []
  variables:
    GIT_DEPTH: "1"
  script:
    - go run tools/cilint.go

# staticcheck, pinned, fetched by go run: no dependency in go.mod, no tool
# in the image. The review of 2026-09-13 found eight leftovers this would
# have named on the day they were written.
lint:staticcheck:
  stage: quick
  image: ${GO_IMAGE}
  variables:
    GIT_DEPTH: "1"
    GOFLAGS: ""
  script:
    - go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

# --------------------------------------------------------------------------- #
# Test
# --------------------------------------------------------------------------- #
# Extended, not replaced: image, cache, stage and working directory stay as the
# composed template defines them. Only coverage and -race are added here.
#
# The count assertion is the point of the second script line. A suite that runs
# zero tests and a suite that does not run at all are both green otherwise.
# A licence gate that cannot fail the pipeline is a report.
lint:reuse:
  allow_failure: false

test:go:
  script:
    - go test -race -coverprofile=coverage.out ./...
    - |
      set -eu
      pkgs="$(go list ./... | wc -l | tr -d ' ')"
      echo "packages under test: $pkgs"
      test "$pkgs" -gt 0 || { echo "no packages - the suite did not run"; exit 1; }
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

# The same suite on the public fixture root - the synthetic twin under
# testdata/public, which is what the public mirror carries once the
# estate's own fixtures are filtered out. Green here is what proves the
# published tree tests itself; a test that only passes on the estate's
# captures is found here, not by a contributor.
test:go:public:
  stage: test
  image: ${GO_IMAGE}
  needs: []
  variables:
    PINUP_FIXTURES: testdata/public
  script:
    - go test -race ./...

# The mutation suite: every harness layer is broken on purpose, one
# named change at a time, and its tests must go red - the answer to "how
# do we know this gate can fail". It copies the tracked tree, so it needs
# git and the full checkout, and runs go test twenty-odd times.
test:mutation:
  stage: test
  image: ${GO_IMAGE}
  needs: [test:go]
  variables:
    PINUP_MUTATE: "1"
    GIT_DEPTH: "1"
  script:
    - go test -count=1 -timeout 30m -v ./tools/mutate/

# The task sandbox, proven in the images production runs tasks in. test:go
# proves it in the golang image, as root; the runner's partitions and
# update:pinup run tasks as uid 1000 in pinup-toolchain, and the estate's
# golden image is the other place pinup executes. The kernel allows the
# sandbox only because the executor applies no seccomp profile (measured
# 2026-09-22) - a property of the runner configuration, not a promise - so
# this is where a hardened executor shows up: red here, before a release
# ships a pinup that would refuse every task.
#
# The binaries are built once and run without the repository: neither image
# needs Go or git for it.
test:sandbox:build:
  stage: test
  image: ${GO_IMAGE}
  needs: []
  variables:
    GIT_DEPTH: "1"
  script:
    - CGO_ENABLED=0 go test -c -o sandbox.test ./sandbox/
    - CGO_ENABLED=0 go test -c -o plugin.test ./plugin/
  artifacts:
    paths: [sandbox.test, plugin.test]
    expire_in: 1 day

.test:sandbox:
  stage: test
  needs: [test:sandbox:build]
  cache: []
  variables:
    GIT_STRATEGY: none
  script:
    - id
    - ./sandbox.test -test.v -test.count=1
    - ./plugin.test -test.v -test.count=1 -test.run 'Isolat'

test:sandbox:toolchain:
  extends: .test:sandbox
  image: ${PINUP_TOOLCHAIN_IMAGE}

# The rolling major, as the runner pulls it; no annotation, because there is
# no patch version here for pinup to raise.
test:sandbox:image:
  extends: .test:sandbox
  image: registry.ole-hartwig.eu/devops/images/pinup:0

# --------------------------------------------------------------------------- #
# Build - four platforms from one arm64 runner, nothing needs CGO
# --------------------------------------------------------------------------- #
.build:
  stage: build
  needs: [test:go]
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod
    policy: pull
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      mkdir -p dist
      CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
        go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
        -o "dist/${BINARY}" ./cmd/pinup
      cd dist
      # The golden image ships no /usr/bin/zip, and an apt-get for it would be
      # a second package channel in a pipeline that otherwise needs only Go.
      go run ../tools/zip.go "pinup-${LABEL}.zip" "${BINARY}"
      sha256sum "pinup-${LABEL}.zip" > "pinup-${LABEL}.zip.sha256"
      # The bare binary as well, under its platform name: devops/images/pinup
      # fetches it with a job token and needs no unzip in its build.
      mv "${BINARY}" "pinup-${LABEL}"
  artifacts:
    paths:
      - dist/*.zip
      - dist/*.sha256
      - dist/pinup-linux-*
      - dist/pinup-darwin-*
    expire_in: 1 week

build:linux-arm64:
  extends: .build
  variables: {TARGET_OS: linux, TARGET_ARCH: arm64, LABEL: linux-arm64, BINARY: pinup}

build:linux-amd64:
  extends: .build
  variables: {TARGET_OS: linux, TARGET_ARCH: amd64, LABEL: linux-amd64, BINARY: pinup}

build:darwin-arm64:
  extends: .build
  variables: {TARGET_OS: darwin, TARGET_ARCH: arm64, LABEL: darwin-arm64, BINARY: pinup}

build:darwin-amd64:
  extends: .build
  variables: {TARGET_OS: darwin, TARGET_ARCH: amd64, LABEL: darwin-amd64, BINARY: pinup}

# --------------------------------------------------------------------------- #
# Release - manifest, upload, links. Complete version tags only: a pre-release
# tag such as v0.1.0-rc1 builds in full and publishes nothing, which is how
# the path is exercised without anybody being able to download the result.
# --------------------------------------------------------------------------- #
manifest:
  stage: release
  image: ${GO_IMAGE}
  before_script: []
  needs: [build:linux-arm64, build:linux-amd64, build:darwin-arm64, build:darwin-amd64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # Sorted, so two runs of the same state produce the same manifest. Zips
    # and bare binaries both: the image fetches the binary and checks it
    # against this file.
    - cd dist && sha256sum *.zip pinup-linux-* pinup-darwin-* | sort -k2 > "$CI_PROJECT_DIR/SHA256SUMS"
    - cat "$CI_PROJECT_DIR/SHA256SUMS"
  artifacts:
    paths: [SHA256SUMS]
    expire_in: 1 month

upload:
  stage: release
  image: ${GO_IMAGE}
  before_script: []
  needs:
    - build:linux-arm64
    - build:linux-amd64
    - build:darwin-arm64
    - build:darwin-amd64
    - manifest
    # The component's job is sign:artifact:<file>. Optional, because the
    # component creates it only where signing is possible; whether the
    # signature exists is checked below, not assumed.
    - job: sign:artifact:SHA256SUMS
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # The manifest must be there and its signature must be a real file: an
    # unsigned or zero-byte manifest is not a release, and a release page
    # linking a signature that is nowhere is worse than none (S3mail v1.0.0).
    - test -s "$CI_PROJECT_DIR/SHA256SUMS"
    - test -s "$CI_PROJECT_DIR/SHA256SUMS.sig" || { echo "SHA256SUMS.sig is missing or empty; refusing to publish an unsigned release"; exit 1; }
    - cp "$CI_PROJECT_DIR/SHA256SUMS" "$CI_PROJECT_DIR/SHA256SUMS.sig" dist/
    - cd dist && go run ../tools/upload.go "${PACKAGE_URL}/${CI_COMMIT_TAG}" *.zip *.sha256 pinup-linux-* pinup-darwin-* SHA256SUMS SHA256SUMS.sig

# A release starts the runner's fast lane, which raises the golden image
# within minutes; until 2026-09-15 that bump waited for the hourly scan.
# After upload, not on the tag: the image's fetch:binary reads the package
# this pipeline publishes. The runner's job-token allowlist admits this
# group, so the bridge needs no token.
trigger:pinup:
  stage: release
  needs: [upload]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  variables:
    RELEASED_PACKAGE: $CI_PROJECT_PATH
    RELEASED_VERSION: $CI_COMMIT_TAG
  trigger:
    project: pinup/runner
    branch: main

release:links:
  stage: release
  image: ${GO_IMAGE}
  before_script: []
  needs: [upload]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # semantic-release created the release page when it cut the tag; the
    # packages come from this pipeline, so this job adds the links only.
    - go run tools/release.go "${PACKAGE_URL}/${CI_COMMIT_TAG}" pinup-linux-arm64.zip:package pinup-linux-amd64.zip:package pinup-darwin-arm64.zip:package pinup-darwin-amd64.zip:package SHA256SUMS:other SHA256SUMS.sig:other

# --------------------------------------------------------------------------- #
# Dogfooding - pinup updates this repository from its own HEAD
#
# On the schedule: the job builds pinup from the tree it runs in and points
# it at this repository under the estate's runner configuration, fetched
# from pinup/runner (devops/renovate-runner until the cutover's step 12,
# 2026-09-16). What it opens is a merge request against
# this repository, signed with the key the job imports, showing Verified.
# Release criterion, not milestone. The job image is the toolchain image,
# for gpg and go; the golang image has no gpg, which the first live run
# found (2026-09-12).
#
# It builds its own binary and needs nothing: a push to main while the
# scheduled pipeline runs cancels the interruptible test and build jobs,
# and a job that waited on them was skipped with them - the daily run of
# 2026-09-13 did not happen. HEAD was tested when it was pushed.
#
# Variables (group pinup, masked): PINUP_GITLAB_TOKEN with api and
# write_repository, PINUP_GIT_NAME, PINUP_GIT_EMAIL, PINUP_GPG_PRIVATE_KEY
# (armored) and PINUP_GPG_KEY_ID. PINUP_MODE=whatif turns the job into a
# dry run that pushes nothing.
# --------------------------------------------------------------------------- #
update:pinup:
  stage: update
  image: ${PINUP_TOOLCHAIN_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never
  needs: []
  interruptible: false
  cache:
    - key:
        files: [go.sum]
      paths: [.go/pkg/mod]
      policy: pull
    # The lookup cache: release lists, first-seen records (release age
    # counts from them), advisories, release notes. Kept between the
    # daily runs, as the runner keeps its own.
    - key: pinup-cache
      paths: [.pinup/cache.db]
  variables:
    PINUP_GITLAB_URL: $CI_SERVER_URL
    PINUP_SIGNING_FORMAT: openpgp
    PINUP_SIGNING_KEY: $PINUP_GPG_KEY_ID
    PINUP_CACHE: .pinup/cache.db
    # What the go.sum refresh may see besides the baseline: the module
    # cache and the toolchain policy, nothing of the job's identity.
    PINUP_PLUGIN_ENV: "GOPATH,GOMODCACHE,GOCACHE,GOFLAGS,GOTOOLCHAIN,GOPROXY,GONOSUMDB,GOPRIVATE"
  script:
    - |
      set -eu
      test -n "${PINUP_GITLAB_TOKEN:-}" || { echo "PINUP_GITLAB_TOKEN is not set; a job token cannot push or open a merge request"; exit 1; }
      # The key lives outside HOME: a task pinup runs (go mod tidy here)
      # gets a scratch HOME and none of the job's, so the imported key
      # is nowhere a task can read.
      GNUPGHOME=$(mktemp -d); export GNUPGHOME
      printf '%s\n' "$PINUP_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
      # Imported, so the armored key has done its job: out of the
      # environment before pinup starts, and so out of pinup's own
      # /proc/<pid>/environ, which a task under the same uid can read.
      unset PINUP_GPG_PRIVATE_KEY
      CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${CI_COMMIT_SHORT_SHA}" -o /tmp/pinup ./cmd/pinup
      /tmp/pinup version
      mode="run"
      if [ "${PINUP_MODE:-}" = "whatif" ]; then mode="run --dry-run"; fi
      # shellcheck disable=SC2086
      /tmp/pinup $mode --project "$CI_PROJECT_PATH" --config "local>pinup/runner" --report pinup-plan.json
  artifacts:
