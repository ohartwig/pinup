# A scheduled pinup workflow on GitHub. A GitHub token with no GitLab
# instance in the environment selects the GitHub platform; a fine-grained
# token needs contents, pull requests and issues read/write on the
# repositories it should update. GITHUB_TOKEN of the workflow works for
# the repository the workflow runs in.
#
# On the image instead of `go install`: add
#   container: ghcr.io/ohartwig/pinup:0
# to the job and drop the setup-go and go install steps. The image carries
# git and nothing pinup does not need; use pinup-toolchain where a lock
# file has to be regenerated.

name: dependency updates
on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pinup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.27" }
      - run: go install github.com/ohartwig/pinup/cmd/pinup@latest
      # --config names the run's configuration (here: the repository's own
      # file, from the checkout); pinup clones the project it updates through
      # the token and reads that clone's own configuration file on top.
      - run: |
          pinup run --project "$GITHUB_REPOSITORY" --config .pinup.json --report plan.json
        env:
          PINUP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINUP_GIT_NAME: Dependency Bot
          PINUP_GIT_EMAIL: bot@example.org
          PINUP_SIGNING_FORMAT: none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: plan, path: plan.json }
